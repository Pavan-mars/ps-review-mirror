# ============================================================================
# CUBIC MARS - Docker Compose (Local Development)
# Usage: docker compose -f docs/docker-compose.yml up --build
# ============================================================================

version: '3.9'

services:
  # React Dashboard (Nginx)
  dashboard:
    build:
      context: ..
      dockerfile: docs/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    networks:
      - cubic-net

  # Backend API (placeholder - team will implement)
  api:
    image: python:3.11-slim
    command: >
      bash -c "pip install fastapi uvicorn psycopg2-binary &&
               echo 'API placeholder - implement your FastAPI service here' &&
               uvicorn main:app --host 0.0.0.0 --port 8000 || sleep infinity"
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cubic_mars
      - DB_USER=cubic_admin
      - DB_PASSWORD=localdev123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cubic-net

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cubic_mars
      POSTGRES_USER: cubic_admin
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubic_admin -d cubic_mars"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cubic-net

  # Redis (session cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cubic-net

volumes:
  pgdata:

networks:
  cubic-net:
    driver: bridge

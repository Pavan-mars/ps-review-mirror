# ============================================================================
# CUBIC MARS - Nginx Configuration for React SPA
# Handles client-side routing, security headers, caching, and health endpoint
# ============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.cubicmars.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ---- Health Check Endpoint (for ALB/ECS) ----
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"cubic-mars-dashboard"}';
        add_header Content-Type application/json;
    }

    # ---- Static Assets (hashed by Vite - long cache) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Favicon and static root files ----
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # ---- SPA Fallback (React Router) ----
    location / {
        try_files $uri $uri/ /index.html;

        # No cache for index.html (ensures fresh deploys are picked up)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ---- API Proxy (uncomment when backend is ready) ----
    # location /api/ {
    #     proxy_pass http://cubic-mars-api:8000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 30s;
    #     proxy_read_timeout 60s;
    #     proxy_send_timeout 60s;
    # }

    # ---- Block sensitive files ----
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- Custom error pages ----
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

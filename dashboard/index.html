         bundle: classic scripts execute synchronously before any module
         evaluates, which is what lets src/runtimeConfig.js read
         window.__APP_CONFIG__ at import time without an async gate. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>

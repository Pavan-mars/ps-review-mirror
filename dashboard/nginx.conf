server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ALB / ECS container health check target -- keep this cheap and
    # dependency-free (no proxy_pass to the API, just "is nginx up").
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # client-side routes (react-router) -- always fall back to index.html
    # so a deep link / refresh on e.g. /ps2 doesn't 404 at the edge.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # long-cache the hashed Vite build assets; never cache index.html so a
    # new deploy is picked up on next load instead of served stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

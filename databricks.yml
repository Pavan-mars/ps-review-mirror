# Databricks Asset Bundle — CUBIC MARS Chicago
# Deploy:  databricks bundle validate && databricks bundle deploy -t dev
# Run job:  databricks bundle run medallion_ps1_daily -t dev
#            databricks bundle run medallion_ps3_daily -t dev
#
# See docs/deployment/Databricks_on_AWS_Deployment_Guide.md for workspace setup.

bundle:
  name: cubic-mars-chicago

variables:
  catalog:
    description: Unity Catalog name
    default: mars_dev
  gold_bucket:
    description: S3 bucket for gold / cross-wire parquet exports
    default: cubic-mars-pm-s3-datalake-dev-gold-170202974600
  artifact_bucket:
    description: S3 bucket for SageMaker ML artifacts (PS1 features + scores)
    default: cubic-mars-pm-s3-datalake-dev-artifacts-170202974600

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-c05ec222-36c5.cloud.databricks.com
      # No profile pinned here: a shared bundle must not hardcode one person's
      # ~/.databrickscfg entry (deploys failed for anyone else until 25-Aug).
      # Pass your own with -p <profile>, e.g.:
      #   databricks bundle deploy -t dev -p chicago

resources:
  jobs:
    cross_wired_daily:
      name: "[${bundle.target}] cubic-mars cross-wire daily"
      description: |
        Unified PS1–PS5 cross-wire export to S3 for Dispatcher → Handler → RDS.
        In the event-driven PS1 path, Step Functions triggers this AFTER SageMaker
        scoring — not from the gold-export job. Schedule stays PAUSED until SFN is live.
        Spec: docs/architecture/Cross_Wire_Databricks_Daily_Job_Column_Manifest.md
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: cross_wired_export
          description: Build and write cross-wire parquet + manifest to S3
          notebook_task:
            notebook_path: ./notebooks/cross_wired_daily_job.py
            base_parameters:
              catalog: ${var.catalog}
              bucket: ${var.gold_bucket}
              artifact_bucket: ${var.artifact_bucket}
              cross_wire_prefix: chicago/cross_wired
              city_id: CHI
              lookback_days: "1"
              register_delta: "true"
              asof_date: ""
          new_cluster: &cross_wire_cluster
            spark_version: "15.4.x-scala2.12"
            # 26-Aug: job clusters ran with NO AWS identity; the S3 export and
            # the boto3 PutEvents emitter both need one. Same profile the
            # interactive cluster has always used.
            aws_attributes:
              instance_profile_arn: arn:aws:iam::170202974600:instance-profile/mars-databricks-cluster-role
            node_type_id: m5d.xlarge
            num_workers: 2
            spark_conf:
              spark.databricks.delta.formatCheck.enabled: "false"
            data_security_mode: SINGLE_USER
          timeout_seconds: 3600

    medallion_ps1_daily:
      name: "[${bundle.target}] cubic-mars gold + PS1 daily pre-score"
      description: |
        Daily medallion export plus PS1 feature build and Gold Layer Complete event.
        Chain: run_layer_gold -> export_gold_to_s3 -> ps1_build_features_daily
        -> ps1_gold_complete_event (PutEvents). Cross-wire is NOT included here;
        it runs after SageMaker scoring via Step Functions (see ps1_eventbridge_build.sh).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: gold_build
          notebook_task:
            notebook_path: ./notebooks/run_layer_gold.py
            base_parameters:
              catalog: ${var.catalog}
          new_cluster: &medallion_cluster
            spark_version: "15.4.x-scala2.12"
            # 26-Aug: job clusters ran with NO AWS identity; the S3 export and
            # the boto3 PutEvents emitter both need one. Same profile the
            # interactive cluster has always used.
            aws_attributes:
              instance_profile_arn: arn:aws:iam::170202974600:instance-profile/mars-databricks-cluster-role
            node_type_id: m5d.2xlarge
            num_workers: 4
            data_security_mode: SINGLE_USER

        - task_key: export_gold_s3
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: ./notebooks/export_gold_to_s3.py
            base_parameters:
              catalog: ${var.catalog}
              bucket: ${var.gold_bucket}
              prefix: chicago/gold
              mode: overwrite
          new_cluster: *medallion_cluster

        - task_key: ps1_build_features
          description: |
            PS1 daily feature frames (97d lookback, pinned contract).
            Requires s3://<artifact_bucket>/chicago/ps1/contracts/ps1_*_feature_contract.json
          depends_on:
            - task_key: export_gold_s3
          notebook_task:
            notebook_path: ./notebooks/ps1_build_features_daily.py
            base_parameters:
              catalog: ${var.catalog}
              artifact_bucket: ${var.artifact_bucket}
              asof_date: ""
              fleet: ALL
              dry_run: "false"
          new_cluster: *medallion_cluster
          timeout_seconds: 7200

        - task_key: ps1_gold_complete_event
          description: Verify gold row counts, then emit Gold Layer Complete to EventBridge
          depends_on:
            - task_key: ps1_build_features
          notebook_task:
            notebook_path: ./notebooks/ps1_gold_complete_event.py
            base_parameters:
              catalog: ${var.catalog}
              city_id: CHI
              asof_date: ""
              dry_run: "false"
          new_cluster: *medallion_cluster
          timeout_seconds: 1800   # 26-Aug: was 600; each task spins its own cluster and ~5-8 min of provisioning counts against the cap - run 779825167758356 timed out on the emitter before its one boto3 call ran

    medallion_ps3_daily:
      name: "[${bundle.target}] cubic-mars PS3 daily pre-score"
      description: |
        PS3 silver+gold incremental refresh, S3 export, and PutEvents for batch scoring.
        Chain: ps3_daily_incremental -> export_gold_ps3_incremental_to_s3
        -> ps3_gold_complete_event. SageMaker Batch Transform + RDS load run on AWS
        via EventBridge (see tooling/sfn/ps3_daily_scoring.asl.json).
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # 26-Aug: one shared cluster for all three tasks. Per-task new_cluster
      # meant THREE separate m5d.2xlarge x4 acquisitions per run; the third
      # hung until the task timeout twice in a row (runs 779825167758356 and
      # 218747713162332 - the emitter never got a cluster). Sharing also cuts
      # ~15 min of provisioning per run.
      job_clusters:
        - job_cluster_key: ps3_daily
          new_cluster: *medallion_cluster
      tasks:
        - task_key: ps3_silver_gold_incremental
          description: MERGE gold.device_ps3_incident on availability_event_id
          notebook_task:
            notebook_path: ./notebooks/ps3_root_cause_analysis/databricks_daily/ps3_daily_incremental.py
            base_parameters:
              catalog: ${var.catalog}
              INCREMENTAL_MODE: merge
              DRY_RUN: "false"
          job_cluster_key: ps3_daily
          timeout_seconds: 7200

        - task_key: export_ps3_to_s3
          depends_on:
            - task_key: ps3_silver_gold_incremental
          notebook_task:
            notebook_path: ./notebooks/ps3_root_cause_analysis/databricks_daily/export_gold_ps3_incremental_to_s3.py
            base_parameters:
              catalog: ${var.catalog}
              bucket: ${var.gold_bucket}
              prefix: chicago/gold
              # the PRE-merge watermark, published by the task above; blank here
              # would re-read the watermark the merge just advanced
              since_date: "{{tasks.ps3_silver_gold_incremental.values.since}}"
          job_cluster_key: ps3_daily
          timeout_seconds: 3600

        - task_key: ps3_gold_complete_event
          description: Verify PS3 gold rows, emit PS3 Gold Export Complete to EventBridge
          depends_on:
            - task_key: export_ps3_to_s3
          notebook_task:
            notebook_path: ./notebooks/ps3_gold_complete_event.py
            base_parameters:
              catalog: ${var.catalog}
              city_id: CHI
              bucket: ${var.gold_bucket}
              # forwarded from the exporter, NOT re-derived. The exporter
              # partitions the feed on the cluster's calendar date; the emitter
              # falls back to MAX(transit_day), the data date. Whenever those
              # differ, a re-derived URI names a prefix that holds no objects.
              asof_date: "{{tasks.export_ps3_to_s3.values.asof}}"
              incr_s3_uri: "{{tasks.export_ps3_to_s3.values.incr_s3_uri}}"
              dry_run: "false"
          job_cluster_key: ps3_daily
          timeout_seconds: 1800   # 26-Aug: was 600; each task spins its own cluster and ~5-8 min of provisioning counts against the cap - run 779825167758356 timed out on the emitter before its one boto3 call ran

    ps3_daily_pre_score:
      name: "[${bundle.target}] cubic-mars PS3 export + event only"
      description: |
        Standalone PS3 chain when gold is already refreshed: S3 export -> PutEvents.
        Use for manual reruns or when ps3_daily_incremental ran separately.
      schedule:
        quartz_cron_expression: "0 30 7 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: export_ps3_to_s3
          notebook_task:
            notebook_path: ./notebooks/ps3_root_cause_analysis/databricks_daily/export_gold_ps3_incremental_to_s3.py
            base_parameters:
              catalog: ${var.catalog}
              bucket: ${var.gold_bucket}
              prefix: chicago/gold
              since_date: ""
          new_cluster: *cross_wire_cluster
          timeout_seconds: 3600

        - task_key: ps3_gold_complete_event
          depends_on:
            - task_key: export_ps3_to_s3
          notebook_task:
            notebook_path: ./notebooks/ps3_gold_complete_event.py
            base_parameters:
              catalog: ${var.catalog}
              city_id: CHI
              bucket: ${var.gold_bucket}
              asof_date: "{{tasks.export_ps3_to_s3.values.asof}}"
              incr_s3_uri: "{{tasks.export_ps3_to_s3.values.incr_s3_uri}}"
              dry_run: "false"
          new_cluster: *cross_wire_cluster
          timeout_seconds: 1800   # 26-Aug: was 600; each task spins its own cluster and ~5-8 min of provisioning counts against the cap - run 779825167758356 timed out on the emitter before its one boto3 call ran

    ps1_daily_pre_score:
      name: "[${bundle.target}] cubic-mars PS1 pre-score only"
      description: |
        Standalone PS1 chain when gold is already exported: features -> PutEvents.
        Use for manual reruns or when medallion ran separately.
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: ps1_build_features
          notebook_task:
            notebook_path: ./notebooks/ps1_build_features_daily.py
            base_parameters:
              catalog: ${var.catalog}
              artifact_bucket: ${var.artifact_bucket}
              asof_date: ""
              fleet: ALL
              dry_run: "false"
          new_cluster: *cross_wire_cluster
          timeout_seconds: 7200

        - task_key: ps1_gold_complete_event
          depends_on:
            - task_key: ps1_build_features
          notebook_task:
            notebook_path: ./notebooks/ps1_gold_complete_event.py
            base_parameters:
              catalog: ${var.catalog}
              city_id: CHI
              asof_date: ""
              dry_run: "false"
          new_cluster: *cross_wire_cluster
          timeout_seconds: 1800   # 26-Aug: was 600; each task spins its own cluster and ~5-8 min of provisioning counts against the cap - run 779825167758356 timed out on the emitter before its one boto3 call ran

    # medallion_and_cross_wire (legacy alias) was REMOVED 25-Aug-2026.
    # It was an unscheduled full duplicate of medallion_ps1_daily INCLUDING the
    # ps1_gold_complete_event task -- deploying both and triggering either meant
    # the gold-complete event could fire twice and start two scoring runs for
    # the same asof_date. medallion_ps1_daily is the sole owner of that chain.

    ps4_weekly_v3_draft:
      name: "[${bundle.target}] cubic-mars PS4 weekly anomaly + clustering v3 (DRAFT)"
      description: |
        DRAFT for team ratification, mirroring the PS2 draft above (decision
        note 16-Aug, PS4 row: PySpark variants ratified as the engine; the
        chicago/ps4/v3 producer was recovered and committed 19-Aug as
        notebooks/ps4_weekly_v3/). Weekly cadence to match the live Monday
        08:00 UTC v3 loader; the notebook publishes READY.json last, so a
        failed run cannot be half-loaded.
        Scope note: this draft runs ONLY the weekly v3 producer, whose entire
        env contract is PS4_AS_OF_DATE. The fault-clustering trio and the
        daily scored feed are NOT included yet: the daily-feed notebook has
        no env contract at all (buckets hardcoded, as-of derived in-notebook)
        and must be parameterised before it can be scheduled - do not add it
        here as-is.
        Kept standalone and PAUSED until (a) the team ratifies and (b)
        incremental ingestion is live - unpausing earlier re-analyzes the
        2026-04-11 vintage.
        First-run sequence, supervised:
          1. databricks bundle validate; manual run with PS4_AS_OF_DATE set
             to a known date (e.g. 2026-04-11) and compare the run_id outputs
             under chicago/ps4/v3/runs/ against ps4-20260728T213153Z-bf4609d4.
          2. Confirm READY.json is written LAST and the Monday 08:00 loader
             picks the run up (/ps4/v3-status advances).
        UNVERIFIED before first run [U]: the notebook was authored in
        SageMaker Studio - its conditional pip bootstrap must no-op on DBR
        (pyspark is native); the job-cluster instance profile can read gold
        and write the artifacts bucket; real runtime (timeout is a guess).
      schedule:
        quartz_cron_expression: "0 30 6 ? * MON"   # Mon 06:30 America/Chicago; well before the Mon 08:00 UTC loader
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: ps4_weekly_v3
          description: PS4 weekly device summary + alerts + cluster profile, v3 family (READY.json-gated)
          notebook_task:
            notebook_path: ./notebooks/ps4_weekly_v3/PS4_SageMaker_Anomaly_Clustering_Weekly_RDS_v3_gp.ipynb
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            aws_attributes:
              instance_profile_arn: arn:aws:iam::170202974600:instance-profile/mars-databricks-cluster-role
            node_type_id: m5d.2xlarge
            num_workers: 4
            data_security_mode: SINGLE_USER
            spark_env_vars:
              PS4_AS_OF_DATE: ""   # blank = the notebook derives the as-of; set explicitly for a supervised replay
          timeout_seconds: 10800

    medallion_ps2_daily:
      name: "[${bundle.target}] cubic-mars PS2 daily cascade analytics (DRAFT)"
      description: |
        DRAFT for team ratification (decision note 16-Aug, PS2 row): v2.5.4 is
        Spark-native (31 pyspark hits), so the daily run belongs in Databricks,
        chained after the Gold build. Final wiring once ratified: move this task
        into the gold workflow after export_gold_s3 (same-workflow trigger).
        Kept standalone and PAUSED until (a) the team ratifies and (b)
        incremental ingestion is live - unpausing earlier re-analyzes the
        2026-04-11 vintage.
        First-run sequence, supervised:
          1. databricks bundle validate; then a manual run with PS2_RUN_MODE
             left at REPLAY (writes the isolated replay family; the scheduled
             loader never sees it).
          2. Compare the replay run's table row counts against the 03-Aug run.
          3. Set PS2_RUN_MODE=PRODUCTION below, run once supervised; confirm a
             new computed_date under chicago/ps2_outputs/_runs/ and the 07:10
             UTC loader picking it up (/ps2/status advances).
        Notebook export-prefix defaults were fixed 19-Aug (chicago/ps2_outputs);
        the run-mode default stays REPLAY by design - production is opted into
        HERE, not in the notebook.
        UNVERIFIED before first run [U]: job-cluster instance profile can read
        gold + write the artifacts bucket; how the notebook reads gold on
        Databricks (UC vs S3 parquet); real runtime (timeout below is a guess).
      schedule:
        quartz_cron_expression: "0 45 6 * * ?"   # placeholder: after the 06:00 gold job, until chained
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: ps2_failure_patterns_v254
          description: PS2 v2.5.4 union-minutes cascade analytics + 47-table S3 export
          notebook_task:
            notebook_path: ./notebooks/ps2_cascading_failure/PS2_Failure_Patterns_v2_5_4_Union_Minutes.ipynb
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            aws_attributes:
              instance_profile_arn: arn:aws:iam::170202974600:instance-profile/mars-databricks-cluster-role
            node_type_id: m5d.2xlarge
            num_workers: 4
            data_security_mode: SINGLE_USER
            spark_env_vars:
              PS2_RUN_MODE: "REPLAY"   # flip to PRODUCTION only after the supervised replay run passes
          timeout_seconds: 10800

    dim_incident_cmdb_daily:
      name: "[${bundle.target}] cubic-mars device-incident-CMDB dim daily"
      description: |
        Daily rebuild + S3 export of dim_device_incident_cmdb -- the conformed
        device -> incident -> CMDB CI dimension (the July device_incidents CSV,
        now pipeline-owned; that one-time upload never reached RDS). Replicates
        the canonical join logic of PS1_VALIDATOR_Device_Bus_Serial_Map:
        VALIDATOR incidents via silver.incident_task_ci_link x
        bronze.servicenow_task_ci (ci_item_sys_id); TVM/GATE via
        silver.incident_history (wm_asset), CI-enriched through
        servicenow_incident_conformed + task_ci.task.
        Writes gold.dim_device_incident_cmdb (Delta) and parquet + manifest to
        chicago/dim/device_incident_cmdb/ for cubic-mars-dim-incident-loader
        (manifest LAST -- the loader never fires on a half-written folder).
        Kept PAUSED until one supervised run + loader round-trip is ratified;
        upstream is frozen at the 2026-04-11 vintage until incremental
        ingestion lands, so daily runs reproduce the same output until then.
        First-run sequence, supervised:
          1. databricks bundle validate; manual run; check devices=6,619-ish,
             per-category totals, and the HBG00011 spot-check row (104
             incidents, CI c97cb829...).
          2. Invoke cubic-mars-dim-incident-loader dry_run, then real; expect
             rows_loaded == the run's OUT rows.
          3. Confirm dim_device_incident_cmdb appears in the catalog action.
      schedule:
        quartz_cron_expression: "0 15 0 * * ?"   # 00:15 America/Chicago = 05:15 UTC, before the loader window
        timezone_id: America/Chicago
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: build_and_export
          description: Build the device-incident-CMDB dim, write Delta + S3 parquet + manifest
          notebook_task:
            notebook_path: ./notebooks/dim/export_device_incident_cmdb_daily.py
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            aws_attributes:
              instance_profile_arn: arn:aws:iam::170202974600:instance-profile/mars-databricks-cluster-role
            node_type_id: m5d.xlarge
            num_workers: 2
            data_security_mode: SINGLE_USER
            spark_env_vars:
              DIC_CATALOG: ${var.catalog}
              DIC_GOLD_BUCKET: ${var.gold_bucket}
              DIC_S3_PREFIX: chicago/dim/device_incident_cmdb
              DIC_AS_OF_DATE: ""          # blank = today UTC; set for a supervised replay
              DIC_ENABLE_S3_EXPORT: "true"
              DIC_WRITE_DELTA: "true"
          timeout_seconds: 3600

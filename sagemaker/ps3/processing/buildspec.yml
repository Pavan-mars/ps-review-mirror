# CodeBuild spec for the PS3 V26 Processing image.
#
# Self-testing, like the dashboard image's buildspec: the image is BOOTED here
# and only pushed if it proves it can do the things the notebook needs. A green
# build that pushes a broken image costs a whole supervised run to discover.
#
# Requires a privileged (docker) amazonlinux2-x86_64-standard:5.0 project.
# Env: ACCOUNT, REGION, REPO (must be cubic-mars-ps3-processing -- NOT
# cubic-pdm/mars-ps3, which is the endpoint-serving image), TAG.
version: 0.2

env:
  variables:
    REGION: us-east-1
    REPO: cubic-mars-ps3-processing
    TAG: v26

phases:
  pre_build:
    commands:
      - set -eu
      - ACCOUNT=${ACCOUNT:-$(aws sts get-caller-identity --query Account --output text)}
      - URI="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$REPO"
      - echo "target $URI:$TAG"
      # Refuse to push over a serving repo even if REPO is mis-set.
      - case "$REPO" in cubic-pdm/*) echo "REPO must not be a cubic-pdm serving repo"; exit 1;; esac
      - aws ecr describe-repositories --repository-names "$REPO" --region "$REGION" >/dev/null 2>&1
        || aws ecr create-repository --repository-name "$REPO" --region "$REGION"
        --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true
      # The repo is IMMUTABLE: a tag can be pushed exactly once. Without this,
      # a rebuild of a consumed tag pays the full build and all three gates
      # before dying at docker push. Fail in the first ten seconds instead.
      - |
        if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" \
             --region "$REGION" >/dev/null 2>&1; then
          echo "REFUSING: $REPO:$TAG already exists and the repository is IMMUTABLE."
          echo "Pick the next tag (v26a, v27, ...) and re-run; this one cannot be overwritten."
          exit 1
        fi
      - aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"

  build:
    on-failure: ABORT
    commands:
      - docker build -t "$REPO:$TAG" .

  post_build:
    commands:
      # --- gate 1: the python stack the notebook imports is present ---
      - |
        docker run --rm --entrypoint python "$REPO:$TAG" -c "
        import pyspark, pandas, numpy, pyarrow, sklearn, shap, boto3, papermill
        assert numpy.__version__.startswith('1.'), 'numpy must be <2, got ' + numpy.__version__
        print('imports OK | pyspark', pyspark.__version__, '| numpy', numpy.__version__)
        "
      # --- gate 2: the S3A jars are actually baked in, matched pair ---
      - |
        docker run --rm --entrypoint bash "$REPO:$TAG" -c '
        ls "$SPARK_HOME/jars/" | grep -q "^hadoop-aws-3\.3\.4\.jar$" || { echo "hadoop-aws jar missing"; exit 1; }
        ls "$SPARK_HOME/jars/" | grep -q "^aws-java-sdk-bundle-1\.12\.262\.jar$" || { echo "aws sdk bundle missing"; exit 1; }
        echo "S3A jars OK"'
      # --- gate 3: a local[*] session really starts, offline, and can name S3A ---
      # This is the gate that matters. It proves JAVA_HOME resolves, the baked
      # jars satisfy the connector, and no Ivy resolve is attempted -- the whole
      # reason for baking them.
      - |
        docker run --rm --entrypoint python "$REPO:$TAG" -c "
        import os
        from pyspark.sql import SparkSession
        pkgs = os.environ.get('PS3_SPARK_JARS_PACKAGES', 'unset')
        assert pkgs == '', 'expected empty PS3_SPARK_JARS_PACKAGES in the image, got ' + repr(pkgs)
        s = (SparkSession.builder.appName('gate').master('local[*]')
             .config('spark.sql.session.timeZone','UTC').getOrCreate())
        assert s.range(5).count() == 5
        cls = s._jvm.java.lang.Class.forName('org.apache.hadoop.fs.s3a.S3AFileSystem')
        print('spark OK', s.version, '| S3AFileSystem loadable:', cls is not None)
        s.stop()
        "
      # --- gate 4: papermill can actually execute a notebook ---
      # This image exists to do exactly one thing at run time: papermill a
      # notebook through a python3 kernel. Gates 1-3 can all pass on an image
      # whose ENTRYPOINT fails on the first Processing job, and the tag is
      # IMMUTABLE, so that failure would be expensive to undo.
      - |
        docker run --rm --entrypoint python "$REPO:$TAG" -c "
        import json, subprocess, sys
        nb = {'cells': [{'cell_type': 'code', 'metadata': {}, 'execution_count': None,
                         'outputs': [], 'source': ['print(6*7)']}],
              'metadata': {'kernelspec': {'name': 'python3', 'display_name': 'Python 3',
                                          'language': 'python'},
                           'language_info': {'name': 'python'}},
              'nbformat': 4, 'nbformat_minor': 5}
        open('/tmp/g.ipynb', 'w').write(json.dumps(nb))
        ks = subprocess.run([sys.executable, '-m', 'jupyter', 'kernelspec', 'list'],
                            capture_output=True, text=True).stdout
        assert 'python3' in ks, 'no python3 kernelspec: ' + ks
        subprocess.run(['papermill', '/tmp/g.ipynb', '/tmp/g.out.ipynb',
                        '--kernel', 'python3', '--log-output'], check=True)
        out = json.load(open('/tmp/g.out.ipynb'))
        txt = ''.join(''.join(o.get('text', [])) for o in out['cells'][0]['outputs'])
        assert '42' in txt, out['cells'][0]['outputs']
        print('papermill OK, kernel executed:', txt.strip())
        "
      # --- only now does it leave the building ---
      - docker tag "$REPO:$TAG" "$URI:$TAG"
      - docker push "$URI:$TAG"
      - echo "pushed $URI:$TAG"
      - |
        echo "next: python sagemaker/ps3/processing/run_processing_job.py --role-arn <role> --image-uri $URI:$TAG --dry-run"
